name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        env:
          GOTOOLCHAIN: local
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build -trimpath ./...

      - name: CLI smoke tests
        run: |
          go run . version
          go run . man > /dev/null
          go run . completion bash > /dev/null
          go run . completion zsh > /dev/null
          go run . completion fish > /dev/null

      - name: Cross-compile
        run: |
          mkdir -p dist
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="${GITHUB_SHA:-unknown}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            if [ "$goos" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-X github.com/bsamson00/dotseek/internal/dotseek.version=ci -X github.com/bsamson00/dotseek/internal/dotseek.commit=$commit -X github.com/bsamson00/dotseek/internal/dotseek.buildDate=$build_date" \
              -o "dist/dotseek-${goos}-${goarch}${suffix}" .
          done

      - name: Vulnerability scan
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
